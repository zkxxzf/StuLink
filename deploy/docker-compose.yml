services:
  stulink:
    image: stulink:v1.7.0
    container_name: stulink
    pull_policy: never
    ports:
      - "5000:5000"
    volumes:
      - ./stulink-data:/app/data
    restart: unless-stopped
    init: true
    # P2 M-16：最小权限 + 资源/日志上限，避免单容器打满宿主或日志无限增长
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - MKNOD
      - AUDIT_WRITE
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=sqlite:////app/data/system.db
    healthcheck:
      # 真实健康检查：/health 会执行 SELECT 1；不再只看密钥文件存在
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  alumni:
    image: stulink-alumni:v1.0.0
    container_name: stulink-alumni
    pull_policy: never
    depends_on:
      stulink:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - ./stulink-data:/app/data:ro
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - MKNOD
      - AUDIT_WRITE
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai

  # MCP 服务：独立容器，给 AI 客户端（IDE 插件 / 桌面应用 / 豆包等）提供 StuLink 数据能力。
  # 镜像由 Dockerfile.mcp 构建：docker build -f Dockerfile.mcp -t stulink-mcp:v1.0.0 .
  mcp:
    image: stulink-mcp:v1.0.0
    container_name: stulink-mcp
    pull_policy: never
    depends_on:
      stulink:
        condition: service_healthy
    ports:
      # H-09：只发布到宿主机回环，局域网无法直连；确需远程访问时走反代/隧道。
      - "127.0.0.1:8765:8765"
    volumes:
      # MCP 直接读取主应用的 SQLite 库：读写挂载（WAL 库无法在只读挂载下打开）
      - ./stulink-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - MKNOD
      - AUDIT_WRITE
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=sqlite:////app/data/system.db
      # 容器内必须监听 0.0.0.0 才能被外部访问；认证默认 account（每请求校验账号密码）
      - STULINK_MCP_HOST=0.0.0.0
      # Host 头白名单（DNS 重绑定防护）：容器内自动探测到的是容器自身 IP，
      # 从宿主机 IP 直接访问、或走本机端口转发（127.0.0.1:8765 → 本机）访问时，
      # Host 不在白名单里 → 421 Invalid Host header。显式配置后会**覆盖**自动探测，
      # 所以本机/回环地址也要一并保留（本机调试与端口转发都靠它）。
      # 注意 IP 与 IP:端口 是两种形式，都要写；换域名/换 IP 访问时在此追加，逗号分隔。
      - STULINK_MCP_ALLOWED_HOSTS=127.0.0.1,127.0.0.1:8765,localhost,localhost:8765,10.193.191.210,10.193.191.210:8765
      # 生产建议：固定服务令牌并设为必填（防端口被随意扫描）
      # - STULINK_MCP_REQUIRE_TOKEN=true
      # - STULINK_MCP_TOKEN=<用 secrets.token_urlsafe(32) 生成>
      # 只读场景可关闭写工具
      # - STULINK_MCP_ALLOW_WRITE=false

