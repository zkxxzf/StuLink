{% extends "base.html" %}
{% block title %}{{ code }} - StuLink{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:60vh;">
    <div class="text-center">
        <div style="font-size:72px;color:#9ca3af;">{{ code }}</div>
        <h5 class="mt-3">{{ message }}</h5>
        {# 2026-10-15 修复：这里原指向 dashboard.index（宿舍模块首页）——项目早期是宿舍系统，
           于是无权限/404/500 点「返回首页」会被丢进宿舍；且无 dormitory.view 的账号会被再 403
           卡在错误页里。统一回全站落地页 welcome.index（登录即可进）。 #}
        <a href="{{ url_for('welcome.index') }}" class="btn btn-primary mt-3">
            <i class="bi bi-house"></i> 返回首页
        </a>
    </div>
</div>
{% endblock %}
