{% extends "base.html" %}
{% block title %}{% if edit_mode %}编辑表单{% else %}创建表单{% endif %}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">
        <i class="bi bi-ui-checks-grid"></i>
        {% if edit_mode %}编辑表单{% else %}创建新表单{% endif %}
    </h4>
    <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('academic.form_list') }}">
        <i class="bi bi-arrow-left"></i> 返回列表
    </a>
</div>

<form method="POST" id="formBuilderForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="questions_json" id="questions_json" value="">

    <!-- 基本信息 -->
    <div class="card mb-3">
        <div class="card-header"><i class="bi bi-info-circle"></i> 基本信息</div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">表单标题 <span class="text-danger">*</span></label>
                    <input name="title" class="form-control" maxlength="100" required
                           value="{{ form_data.title if form_data else '' }}"
                           placeholder="请输入表单标题">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">分类</label>
                    <select name="category" class="form-select">
                        <option value="">-- 选择分类 --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.name }}"
                            {% if form_data and form_data.category == cat.name %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">目标群体</label>
                    <select name="target_type" class="form-select" id="targetTypeSelect">
                        {% for k, label in target_map.items() %}
                        <option value="{{ k }}"
                            {% if form_data and form_data.target_type == k %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">描述说明</label>
                <textarea name="description" class="form-control" rows="2" maxlength="500"
                          placeholder="简要说明表单目的和填写要求">{{ form_data.description if form_data else '' }}</textarea>
            </div>

            <div class="row">
                <div class="col-md-3 mb-3">
                    <label class="form-label">开始时间</label>
                    <input type="datetime-local" name="start_time" class="form-control"
                           value="{{ form_data.start_time if form_data else '' }}">
                    <div class="form-text">留空表示立即开始</div>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">截止时间</label>
                    <input type="datetime-local" name="deadline" class="form-control"
                           value="{{ form_data.deadline if form_data else '' }}">
                    <div class="form-text">留空表示无截止</div>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">文件大小限制 (MB)</label>
                    <input type="number" name="max_file_size" class="form-control" min="1" max="100"
                           value="{{ form_data.max_file_size_mb if form_data else 10 }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">允许多次提交</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" name="allow_multiple" value="1"
                               id="allowMultipleSwitch"
                               {% if form_data and form_data.allow_multiple %}checked{% endif %}>
                        <label class="form-check-label" for="allowMultipleSwitch">开启后允许同一人多次提交</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 题目编辑区 -->
    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-list-ol"></i> 题目列表</span>
            <button type="button" class="btn btn-sm btn-primary" id="addQuestionBtn">
                <i class="bi bi-plus-lg"></i> 添加题目
            </button>
        </div>
        <div class="card-body" id="questionsContainer">
            <div class="text-muted text-center py-3" id="emptyHint">
                还没有题目，点击上方按钮添加
            </div>
        </div>
    </div>

    <!-- 底部操作 -->
    <div class="d-flex gap-2">
        <button type="submit" name="action" value="draft" class="btn btn-secondary">
            <i class="bi bi-save"></i> 保存草稿
        </button>
        <button type="submit" name="action" value="publish" class="btn btn-success">
            <i class="bi bi-send"></i> 保存并发布
        </button>
        <a class="btn btn-outline-secondary ms-auto" href="{{ url_for('academic.form_list') }}">取消</a>
    </div>
</form>

<!-- 题目类型选项（JS 用） -->
<script>
window.FORM_CONFIG = {
    questionTypes: {{ question_types|tojson }},
    editMode: {{ 'true' if edit_mode else 'false' }},
    formData: {{ form_data|tojson if form_data else 'null' }}
};
</script>
<script src="{{ url_for('static', filename='js/academic_forms.js') }}"></script>
{% endblock %}
