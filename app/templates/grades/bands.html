{% extends "base.html" %}
{% block title %}划线分层 - {{ exam.name }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-3 flex-wrap gap-2">
    <a href="{{ url_for('grades.exam_detail', exam_id=exam.id) }}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
    </a>
    <h5 class="mb-0"><i class="bi bi-bar-chart"></i> 划线分层：{{ exam.name }}</h5>
    <span class="text-muted small">{{ exam.grade }} · 参考学生 {{ total_count }} 人（默认模板：四层 优秀20%/良好60%/及格95% 或 高考线）</span>
</div>

<div class="card mb-3" id="bandApp" data-exam-id="{{ exam.id }}">
    <div class="card-body">
        <div class="row g-2 align-items-center mb-2">
            <div class="col-auto">
                <label class="form-label mb-0 me-1">方向</label>
                <select id="bDir" class="form-select form-select-sm d-inline-block w-auto">
                    {% for d in directions %}
                    <option value="{{ d }}">{{ d }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-auto">
                <button class="btn btn-sm btn-outline-primary" data-tpl="4">应用四层模板（优秀/良好/及格/待提升）</button>
            </div>
            <div class="col-auto">
                <button class="btn btn-sm btn-outline-info" data-tpl="gaokao">应用高考线模板（清北/985/211/特控/本科）</button>
            </div>
            <div class="col-auto form-check ms-2">
                <input class="form-check-input" type="checkbox" id="bBoth" checked>
                <label class="form-check-label small" for="bBoth">应用到全部方向</label>
            </div>
        </div>
        <table class="table g-table align-middle" id="bandTable">
            <thead>
            <tr>
                <th style="width:70px;">序号</th>
                <th>层名</th>
                <th style="width:130px;">下界方式</th>
                <th style="width:150px;">下界值</th>
                <th style="width:140px;">预览换算分数</th>
                <th style="width:100px;">人数</th>
                <th style="width:100px;">占比%</th>
                <th style="width:90px;"></th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-success" id="bAdd"><i class="bi bi-plus"></i> 新增层（追加为最低层）</button>
            <button class="btn btn-sm btn-primary" id="bSave"><i class="bi bi-save"></i> 保存</button>
            <span class="text-muted small align-self-center" id="bMsg"></span>
        </div>
    </div>
</div>

<script>
$(function(){
    var $app = $('#bandApp'), examId = $app.data('examId');
    function readRows(){
        var out = [];
        $('#bandTable tbody tr').each(function(){
            var $r = $(this);
            out.push({
                seq: $r.find('.m-seq').val(),
                name: $r.find('.m-name').val(),
                lower_mode: $r.find('.m-mode').val(),
                lower_value: $r.find('.m-value').val()
            });
        });
        return out;
    }
    function render(list){
        var $tb = $('#bandTable tbody').empty();
        list.forEach(function(b, i){
            var tr = $('<tr>').append(
                $('<td>').append($('<input type="number" min="1" class="form-control form-control-sm m-seq">').val(b.seq)),
                $('<td>').append($('<input class="form-control form-control-sm m-name">').val(b.name)),
                $('<td>').append($('<select class="form-select form-select-sm m-mode">')
                    .append($('<option value="score">固定分数</option>'))
                    .append($('<option value="ratio">按人数比例%</option>'))
                    .val(b.lower_mode)),
                $('<td>').append($('<input type="number" step="0.5" class="form-control form-control-sm m-value">').val(b.lower_value)),
                $('<td class="text-muted small align-middle">').text(b.preview_score != null ? b.preview_score : '—'),
                $('<td class="align-middle">').text(b.count || '—'),
                $('<td class="align-middle">').text(b.ratio != null ? b.ratio : '—'),
                $('<td>').append($('<button class="btn btn-sm btn-outline-danger m-del"><i class="bi bi-x"></i></button>'))
            );
            $tb.append(tr);
        });
    }
    function load(){
        var dir = $('#bDir').val();
        $.getJSON('/grades/api/bands', {exam_id: examId, direction: dir}, function(res){
            render(res.data || []);
        });
    }
    $('#bDir').change(load);
    $('#bAdd').on('click', function(){
        var rows = readRows();
        var seq = rows.length ? (Math.max.apply(null, rows.map(function(x){ return +x.seq || 0; })) + 1) : 1;
        rows.push({seq: seq, name: '', lower_mode: 'score', lower_value: ''});
        render(rows);
    });
    $('#bandTable').on('click', '.m-del', function(){
        if($('#bandTable tbody tr').length <= 1){ alert('至少保留一层'); return; }
        $(this).closest('tr').remove();
    });
    $('#bandTable').on('change', '.m-mode', function(){
        var $v = $(this).closest('tr').find('.m-value');
        $v.attr('step', $(this).val() === 'ratio' ? '1' : '0.5');
    });
    $('[data-tpl]').on('click', function(){
        var dir = $('#bDir').val(), both = $('#bBoth').is(':checked'), tpl = $(this).data('tpl');
        if(!both){ if(!confirm('应用到「' + dir + '」方向（将覆盖该方向现有分层）？')){ return; } }
        else { if(!confirm('将覆盖物理/历史两个方向的现有分层，继续？')){ return; } }
        $.post('/grades/api/bands/apply', JSON.stringify({exam_id: examId, template: tpl,
                direction: dir, both: both}),
            function(res){ $('#bMsg').text(res.message || '已应用'); load(); })
            .fail(function(x){ alert(x.responseJSON && x.responseJSON.message || '应用失败'); });
    });
    $('#bSave').on('click', function(){
        var dir = $('#bDir').val(), bands = readRows();
        if(!bands.length){ alert('没有可保存的层'); return; }
        $.post('/grades/api/bands/save', JSON.stringify({exam_id: examId, direction: dir, bands: bands}),
            function(res){ $('#bMsg').text('已保存 ' + dir + ' 分层'); load(); })
            .fail(function(x){ alert(x.responseJSON && x.responseJSON.message || '保存失败'); });
    });
    load();
});
</script>
{% endblock %}
