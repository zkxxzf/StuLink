{% extends "base.html" %}
{% block title %}任课教师映射 - {{ '教务管理' if request.blueprint == 'academic' else '成绩管理' }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-3 flex-wrap gap-2">
    <a href="{{ url_for(ep('index')) }}" class="btn btn-sm btn-outline-secondary" title="返回" aria-label="返回">
        <i class="bi bi-arrow-left"></i>
    </a>
    <h5 class="mb-0"><i class="bi bi-person-workspace"></i> 任课教师映射</h5>
    <span class="text-muted small">按年级维护：科目 × 班级 → 任课教师（账号制，同一教师可跨年级/跨班带课）</span>
    <div class="ms-auto d-flex gap-2">
        <a href="{{ url_for(ep('teachers_import_page')) }}" class="btn btn-primary btn-sm">
            <i class="bi bi-upload"></i> 批量导入教师安排表
        </a>
        <a href="{{ url_for(ep('teacher_template_download')) }}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-download"></i> 下载模板
        </a>
    </div>
</div>

<div class="card" id="tcApp" data-url="{{ url_for(ep('teachers_get')) }}"
     data-save-url="{{ url_for(ep('teachers_save')) }}">
    <div class="card-body">
        <div class="d-flex align-items-center mb-2 flex-wrap gap-2">
            <label class="form-label mb-0 me-1">年级</label>
            <select id="tcGrade" class="form-select form-select-sm w-auto">
                {% for g in grade_options %}
                <option value="{{ g }}" {% if g == grade %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
            </select>
            <span class="text-muted small">教师账号须先在「系统管理-教师管理」创建；导入安排表时无账号将自动开户。</span>
            <button class="btn btn-sm btn-success ms-auto" id="tcSave"><i class="bi bi-save"></i> 保存全部</button>
        </div>
        <div class="table-responsive" style="max-height:65vh;">
            <table class="table table-sm g-table align-middle mb-0" id="tcTable">
                <thead>
                <tr><th style="min-width:90px;">科目</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="mt-2 text-muted small" id="tcMsg"></div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
$(function(){
    var app = $('#tcApp'), cells = {}, usersStore = [], optsHtml = '';
    function esc(s){
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch];
        });
    }
    function userOptHtml(u){
        return '<option value="' + u.id + '">' + esc(u.name) +
            (u.username ? '（' + esc(u.username) + '）' : '') + '</option>';
    }
    // 完整下拉项（全部教师）只拼一次字符串，避免每格重复构造
    function buildOptsHtml(){
        var buf = ['<option value="">— 未指定 —</option>'];
        usersStore.forEach(function(u){ buf.push(userOptHtml(u)); });
        return buf.join('');
    }
    // 单元格"轻量态"只放当前值一项：初见页面时把 1440×49 个 option 降到 1440 个
    function singleOptHtml(v){
        var u = v ? usersStore.filter(function(x){ return String(x.id) === String(v); })[0] : null;
        return u ? userOptHtml(u) : '<option value="">— 未指定 —</option>';
    }
    // 悬停/聚焦时才按需注入完整下拉项（一个单元格只注入一次）
    function hydrate(sel){
        if (sel.attr('data-hydrated') === '1'){ return; }
        sel.html(optsHtml).val(String(cells[sel.data('key')] == null ? '' : cells[sel.data('key')]));
        sel.attr('data-hydrated', '1');
    }
    function load(){
        var grade = $('#tcGrade').val();
        cells = {};
        $('#tcMsg').text('加载中…');
        $.getJSON(app.data('url'), {grade: grade}, function(res){
            var d = res.data;
            renderMatrix(d);
            $('#tcMsg').text('');
        }).fail(function(x){
            // 2026-10-12 UI 审计 M4：原为「加载失败」四个字，无图标无重试入口。
            // 改为带图标与原因的警示条，并提示可直接刷新重试。
            var why = (x.responseJSON && x.responseJSON.message) ? ('：' + x.responseJSON.message) : '';
            $('#tcMsg').removeClass('text-muted').addClass('text-danger')
                .html('<i class="bi bi-exclamation-triangle-fill"></i> 任课映射加载失败'
                      + esc(why) + '，请点此 <a href="javascript:location.reload()">刷新重试</a>');
        });
    }
    function renderMatrix(d){
        usersStore = d.users || [];
        optsHtml = buildOptsHtml();
        var $head = $('#tcTable thead tr').empty()
            .append('<th style="min-width:90px;">科目</th>');
        d.classes.forEach(function(c){
            var th = $('<th class="text-center" style="min-width:120px;"></th>');
            th.append('<div class="d-flex align-items-center justify-content-center gap-1">' +
                '<span>' + esc(c) + '</span>' +
                '<button type="button" class="btn btn-sm btn-outline-secondary colfill px-1 py-0" ' +
                'data-cls="' + esc(c) + '" title="为该班全部科目批量指定同一教师（整列填充）">' +
                '<i class="bi bi-arrow-down"></i></button></div>');
            $head.append(th);
        });
        // 性能优化：整表 tbody 一次性拼 HTML 写入（单次解析），远快于逐格 jQuery 构建
        var rows = [];
        d.subjects.forEach(function(sub){
            var tds = ['<td><strong>' + esc(sub) + '</strong></td>'];
            d.classes.forEach(function(cls){
                var key = cls + '|' + sub;
                var cur = d.cells[key] && d.cells[key].user_id != null ? String(d.cells[key].user_id) : '';
                cells[key] = cur;
                tds.push('<td class="text-center"><select class="form-select form-select-sm tcell" ' +
                    'data-key="' + esc(key) + '">' + singleOptHtml(cur) + '</select></td>');
            });
            rows.push('<tr>' + tds.join('') + '</tr>');
        });
        $('#tcTable tbody').html(rows.join(''));
    }
    // 单元格改动（委托，避免重复绑定）
    $('#tcTable').on('change', '.tcell', function(){
        cells[$(this).data('key')] = $(this).val();
    });
    // 悬停/聚焦时补全下拉项（原生 select 点击才展开，故悬停即预热，展开时已是完整列表）
    $('#tcTable').on('mouseenter focus', '.tcell', function(){ hydrate($(this)); });
    // 整列填充：为该班全部科目指定同一教师（按姓名/账号匹配）
    $('#tcTable').on('click', '.colfill', function(){
        var cls = $(this).data('cls');
        var input = prompt('为 ' + cls + ' 全部科目指定同一教师：\n输入教师姓名或账号（留空=清除该班全部科目）', '');
        if (input === null){ return; }
        var name = input.trim();
        var u = name ? usersStore.filter(function(x){ return x.name === name || x.username === name; })[0] : null;
        if (name && !u){
            alert('未找到该教师。候选：' + usersStore.slice(0, 12).map(function(x){ return x.name; }).join('、') + (usersStore.length > 12 ? '…' : ''));
            return;
        }
        var v = u ? String(u.id) : '';
        $('#tcTable tbody tr').each(function(){
            $(this).find('.tcell').each(function(){
                var $c = $(this);
                if ($c.data('key').indexOf(cls + '|') === 0){
                    // 轻量态下没有完整 option，直接改写为"单一当前值"并复位 hydrated，
                    // 待下次悬停/聚焦时再按最新值重新补全，避免 val() 落空
                    $c.html(singleOptHtml(v)).attr('data-hydrated', '0');
                    cells[$c.data('key')] = v;
                }
            });
        });
    });
    $('#tcGrade').change(load);
    $('#tcSave').on('click', function(){
        var grade = $('#tcGrade').val();
        if (!grade) { alert('请先选择年级'); return; }
        $('#tcMsg').text('保存中…');
        // v1.19.47.30：必须显式声明 JSON —— 原来 $.post(url, JSON.stringify(...)) 会以
        // application/x-www-form-urlencoded 发送 JSON 文本，后端 get_json 取不到 → 保存静默失效
        $.ajax({
            url: app.data('saveUrl'), type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({grade: grade, cells: cells})
        }).done(function(res){
                $('#tcMsg').text(res.message + '（' + (res.changes ? ('绑定' + res.changes.bound +
                    ' / 变更' + res.changes.changed + ' / 停用' + res.changes.released) : '') + '）');
                load();
            }).fail(function(x){
                alert(x.responseJSON && x.responseJSON.message || '保存失败');
                $('#tcMsg').text('保存失败');
            });
    });
    load();
});
</script>
{% endblock %}
